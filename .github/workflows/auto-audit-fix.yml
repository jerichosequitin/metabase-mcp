name: Auto Audit Fix

on:
  schedule:
    # Every day at 09:00 UTC (17:00 SGT)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit fix
      run: npm audit fix || true

    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet package-lock.json; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No vulnerabilities to fix"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Dependencies updated"
        fi

    - name: Run tests
      if: steps.changes.outputs.changed == 'true'
      run: |
        npm run build:fast
        npm test

    - name: Get audit summary
      if: steps.changes.outputs.changed == 'true'
      id: audit
      run: |
        SUMMARY=$(npm audit 2>/dev/null | tail -5 | head -3 || echo "Audit clean")
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo "$SUMMARY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "fix: auto audit fix — resolve dependency vulnerabilities"
        title: "fix: auto audit fix — resolve dependency vulnerabilities"
        body: |
          ## Automated Dependency Security Fix

          This PR was automatically created by the weekly `npm audit fix` workflow.

          ### Audit Summary
          ```
          ${{ steps.audit.outputs.summary }}
          ```

          ### Verification
          - ✅ `npm audit fix` applied
          - ✅ Build passes
          - ✅ All tests pass

          > Auto-generated by `.github/workflows/auto-audit-fix.yml`
        branch: auto/audit-fix
        delete-branch: true
